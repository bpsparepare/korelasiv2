name: korelasi
description: "A new Flutter project."

publish_to: "none"

version: 2.2.0+4

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter  
  provider: ^6.1.3 # Tambahkan untuk state management
  mobile_scanner: ^7.0.1
  cached_network_image: ^3.3.1 # Tambahkan baris ini (gunakan versi terbaru yang kompatibel)
  intl: ^0.20.2
  uuid: ^4.3.3
  image_picker: ^1.0.7
  excel: ^4.0.6
  universal_html: ^2.2.4
  file_selector: ^1.0.3
  path_provider: ^2.1.4

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.1
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ # Pastikan baris ini ada dan indentasinya benar

dependency_overrides:
  intl: ^0.19.0
